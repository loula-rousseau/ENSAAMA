<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>

    <body>
        <a-scene>

            <a-assets>

                <!-- teture mur -->
                <a-mixin
                    id="spirales"
                    src="assets/images/spirales.jpg"
                    material="color: #57001e"
                ></a-mixin>

                <a-mixin
                    id="metal"
                    src="assets/images/metal.jpg"
                    material="color: #57001e"
                ></a-mixin>
                
                <a-mixin
                    id="carelage"
                    src="assets/images/carelage.jpg"
                    material="color: #57001e"
                ></a-mixin>

                <!-- texture sol -->
                <a-mixin
                    id="sol"
                    src="assets/images/nana.jpg"
                ></a-mixin>

                <!-- modèle 3d -->
                <a-asset-item
                    id="obj-arbre"
                    src="assets/models 3D/whnp3v2jflkw-Tree/Tree/Tree.obj"
                ></a-asset-item>
                <a-asset-item
                    id="mtl-arbre"
                    src="assets/models 3D/whnp3v2jflkw-Tree/Tree/Tree.mtl"
                ></a-asset-item>

            </a-assets>

            <a-entity
                id="arbre"
                position="0.1 0 0"
                scale="2 2 2"
                obj-model="mtl: #mtl-arbre; obj: #obj-arbre"
            ></a-entity>

            <!-- ciel -->
            <a-sky src="assets/images/night_sky.jpg" material="color: #454545"></a-sky>

            <!-- sol labyrinthe -->
            <a-plane
                id="sol labyrinthe"
                position="0 -0.5 0"
                rotation="-90 0 0"
                width="4"
                height="4"
                mixin="sol"
                material="opacity: 0.5; color: #d8d4d4; metalness: 0.66; roughness: 0"
            ></a-plane>

            <!-- sol monde -->
            <a-plane 
                id="sol_1 monde" 
                position="0 0.2 0" 
                rotation="-90 0 0" 
                width="4" 
                height="4" 
                mixin="sol" 
                scale="20 20 20" 
                material="opacity: 0.7; color: #d8d4d4; metalness: 0.66; roughness: 0; src: assets/images/nana.jpg">
            </a-plane>

            <a-plane
                id="sol_2 monde"
                position="0 0.1 0"
                rotation="-90 0 0"
                width="4"
                height="4"
                mixin="sol"
                scale="145 60 1"
                material="opacity: 0.7; color: #d8d4d4; metalness: 0.66; roughness: 0"
            >
            </a-plane>

            <a-plane
                id="sol_2 monde fond"
                position="-6.5 -10 6.5"
                rotation="-90 0 0"
                width="4"
                height="4"
                mixin="sol"
                scale="145 60 1"
            ></a-plane>

            <!-- mur extérieur -->
            <a-box 
                id="mur avant" 
                mixin="spirales" 
                position="0 0 1.95" 
                rotation="0 90 90" 
                scale="8 0.1 2" 
                material="src: assets/images/spirales.jpg"
            ></a-box>

            <a-box
                id="mur du fond"
                mixin="metal"
                position="-1.3 0 -2.15"
                rotation="0 90 90"
                scale="8 0.3 2"
            ></a-box>

            <a-box 
                id="mur du fond-2" 
                mixin="metal" 
                position="1.55 0 -2.15"
                rotation="0 90 90" 
                scale="8 0.3 1.5" 
                material="src: assets/images/metal.jpg"
            ></a-box>

            <a-box 
                id="mur latéral droite" 
                mixin="metal" 
                position="2.15 0 0"
                scale="8 0.3 4" 
                material="src: assets/images/metal.jpg" 
                rotation="0 0 90"
            ></a-box>

            <a-box 
                id="mur latéral gauche"
                mixin="metal" 
                position="-2.15 0 0" 
                scale="8 0.3 4" 
                material="src: assets/images/metal.jpg" 
                rotation="0 0 90"
            ></a-box>

            <!-- mur intérieur -->
            <a-box mixin="spirales" position="-0.75 0 0.727" rotation="0 10 90" scale="8 0.1 2.5"></a-box>
            <a-box mixin="spirales" position="-0.3 0 0" rotation="0 10 90" scale="8 0.1 1.5"></a-box>
            <a-box mixin="spirales" position="1 0 0.75" rotation="0 0 90" scale="8 0.1 2.5"></a-box>
            <a-box mixin="spirales" position="-0.97 0 -1.25" rotation="0 0 90" scale="8 0.1 1.5"></a-box>
            <a-box mixin="spirales" position="1.25 0 1.5" rotation="0 90 90" scale="8 0.1 0.5"></a-box>
            <a-box mixin="spirales" position="0.25 0 1.25" rotation="0 90 90" scale="8 0.1 0.5"></a-box>
            <a-box mixin="spirales" position="0.45 0 0" rotation="0 0 90" scale="8 0.1 2.5"></a-box>
            <a-box mixin="spirales" position="0 0 -1.25" rotation="0 90 90" scale="8 0.1 1"></a-box>
            <a-box mixin="spirales" position="0 0 -0.7" rotation="0 90 90" scale="8 0.1 1"></a-box>
            <a-box mixin="spirales" position="1.75 0 0.5" rotation="0 90 90" scale="8 0.1 0.5"></a-box>
            <a-box mixin="spirales" position="1.15 0 -1.5" rotation="0 90 90" scale="8 0.1 0.75"></a-box>
            <a-box mixin="spirales" position="1.25 0 -0.75" rotation="0 -45 90" scale="8 0.1 0.75"></a-box>
            <a-box mixin="spirales" position="0.9 0 -1.65" rotation="0 -45 90" scale="8 0.1 1.25"></a-box>
            <a-box mixin="spirales" position="-1.75 0 -1" rotation="0 90 90" scale="8 0.1 0.5" material="src: assets/images/spirales.jpg"></a-box>
            <a-box mixin="spirales" position="-1.25 0 -1.5" rotation="0 90 90" scale="8 0.1 0.5" material="src: assets/images/spirales.jpg"></a-box>

            <!-- caméra -->
            <a-entity 
                camera="" 
                position="0 1.5 3.5" 
                wasd-controls="acceleration:10" 
                look-controls="" aframe-injected=""
            ><a-entity 
                light="color: #FFF; decay: 0.17; distance: 3; intensity:3; type: point" 
                data-aframe-default-light="" 
                aframe-injected="" 
                position="0 0.142 0.029"></a-entity>
            </a-entity>

            <!-- Lumières -->
            <a-entity 
                id="lumiere d'ambiance"
                light="color: #6ce4b6; decay: -2.15; distance: 4; intensity: 5; type: point" 
                data-aframe-default-light="" 
                aframe-injected="" 
                position="0 -1.5 0.029" 
                scale="10 10 10"
            ></a-entity>

            <a-entity 
                id="lumiere fond marin"
                light="color: #ffffff; intensity: 6.4; type: ambient" 
                data-aframe-default-light="" 
                aframe-injected="" 
                position="0 -0.265 0"
            ></a-entity>

            <a-entity 
            id="spot"
            light="intensity: 1.884; castShadow: true" 
            position="-0.5 4.551 -0.394" 
            data-aframe-default-light="" 
            aframe-injected=""
            ></a-entity>

        </a-scene>

    </body>
</html>
